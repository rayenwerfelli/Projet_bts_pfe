server {
    listen 80;
    server_name localhost;

    # Docker's embedded DNS server. Forces Nginx to re-resolve upstream
    # hostnames instead of caching one IP at startup, so a rebuilt
    # container (new IP) no longer causes a 502.
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Superset (main BI dashboard) — served at the root
    location / {
        set $superset http://superset:8088;
        proxy_pass $superset;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chatbot frontend (React SPA)
    location /chatbot/ {
        set $frontend http://chatbot-frontend:3000;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chatbot backend API
    location /api/ {
        set $backend http://chatbot-backend:8000;
        # Strip the /api prefix so /api/chat reaches the backend as /chat.
        # Explicit rewrite is required when proxy_pass uses a variable
        # (the trailing-slash trick does NOT strip the prefix in that case).
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM calls can take a while; allow enough time before timing out.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}