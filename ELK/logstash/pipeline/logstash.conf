input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}
filter {
  if [service] == "python" or [service] == "dbt" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:log_timestamp} - %{DATA:module} - %{LOGLEVEL:log_level} - %{GREEDYDATA:parsed_message}" }
      tag_on_failure => ["_grok_python_failure"]
    }
  }
  else if [service] == "postgres" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:log_timestamp} %{WORD:tz} \[%{NUMBER:pid}\] %{LOGLEVEL:log_level}: %{GREEDYDATA:parsed_message}" }
      tag_on_failure => ["_grok_postgres_failure"]
    }
  }
  else if [service] == "clickhouse" {
    grok {
      match => { "message" => "%{DATA:log_ts} \[ %{NUMBER:tid} \] <%{DATA:log_level}> %{GREEDYDATA:parsed_message}" }
      tag_on_failure => ["_grok_clickhouse_failure"]
    }
  }
  else if [service] == "superset" {
    grok {
      match => { "message" => "%{LOGLEVEL:log_level}:%{SPACE}%{DATA:module}:%{SPACE}%{GREEDYDATA:parsed_message}" }
      tag_on_failure => ["_grok_superset_failure"]
    }
  }
  else if [service] == "keycloak" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:log_ts} %{LOGLEVEL:log_level} \[%{DATA:module}\] \(%{DATA:thread}\) %{GREEDYDATA:parsed_message}" }
      tag_on_failure => ["_grok_keycloak_failure"]
    }
  }
  if [log_level] {
    mutate { uppercase => ["log_level"] }
  }
  if [log_level] in ["ERROR", "FATAL", "CRITICAL"] {
    mutate { add_field => { "alert_severity" => "high" } }
  } else if [log_level] in ["WARN", "WARNING"] {
    mutate { add_field => { "alert_severity" => "medium" } }
  } else {
    mutate { add_field => { "alert_severity" => "low" } }
  }
  mutate {
    add_field => { "project" => "bts_pfe" }
    remove_field => ["agent", "input", "log", "ecs"]
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "bts-logs-%{service}-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
}