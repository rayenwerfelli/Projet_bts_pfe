services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config:/etc/clickhouse-server/config.d
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - clickhouse_logs:/var/log/clickhouse-server
    environment:
      CLICKHOUSE_DB: public_datamart1
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin123}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bi_net

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: superset
    user: root
    ports:
      - "8088:8088"
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
      - superset_home:/app/superset_home
    depends_on:
      - clickhouse
      - keycloak
    extra_hosts:
      - "localhost:host-gateway"
    networks:
      - bi_net

  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    restart: always
    environment:
      POSTGRES_DB: public_bank
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-admin123}
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    networks:
      - bi_net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: public_bank
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-admin123}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
    command: start-dev
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db
    networks:
      - bi_net

  # ─────────────────────────────────────────────
  # ELK STACK
  # ─────────────────────────────────────────────

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch_bi
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - bi_net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: logstash_bi
    environment:
      - "XPACK_MONITORING_ENABLED=false"
    volumes:
      - ./ELK/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./ELK/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5044:5044"
    networks:
      - bi_net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeat_bi
    user: root
    entrypoint: >
       bash -c "filebeat -e --strict.perms=false"
    volumes:
      - ./ELK/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml
      - ./logs:/host_logs/python:ro
      - ./dw_bts_project/logs:/host_logs/dbt:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - clickhouse_logs:/host_logs/clickhouse:ro
    depends_on:
      - logstash
    networks:
      - bi_net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana_bi
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    networks:
      - bi_net

  # ─────────────────────────────────────────────
  # CHATBOT
  # ─────────────────────────────────────────────

  chatbot-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      SUPERSET_URL: http://superset:8088
      SUPERSET_USERNAME: admin
      SUPERSET_PASSWORD: ${SUPERSET_PASSWORD:-admin}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: dwh
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin123}
      BACKEND_CORS_ORIGINS: "http://localhost,http://localhost:8088,http://localhost:3000"
    depends_on:
      clickhouse:
        condition: service_healthy
      superset:
        condition: service_started
    networks:
      - bi_net

  chatbot-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatbot_frontend
    restart: unless-stopped
    depends_on:
      - chatbot-backend
    networks:
      - bi_net

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - superset
      - chatbot-frontend
      - chatbot-backend
    networks:
      - bi_net

volumes:
  clickhouse_data:
  superset_home:
  clickhouse_logs:
  es_data:
  keycloak_db:

networks:
  bi_net:
    driver: bridge