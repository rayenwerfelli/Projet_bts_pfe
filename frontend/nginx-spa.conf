server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location /chatbot/static/ {
        alias /usr/share/nginx/html/static/;
    }

    location /chatbot/ {
        try_files $uri $uri/ /index.html;
    }

    location = /chatbot {
        return 301 /chatbot/;
    }
}